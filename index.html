<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stark Armor Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at center,#172d3d 0%,#071019 45%,#020509 100%);color:#dffaff;font-family:Arial,sans-serif;overflow-x:hidden}header{padding:20px;text-align:center;border-bottom:1px solid #1e7896;background:#02090fd9}h1{margin:0;color:#64eaff;letter-spacing:4px;text-shadow:0 0 15px #00d9ff}.subtitle{color:#9bb8c4;margin-top:8px}.game{display:grid;grid-template-columns:230px 1fr 280px;gap:20px;padding:25px;max-width:1400px;margin:auto}.panel{background:#05111be8;border:1px solid #17627b;border-radius:12px;padding:16px;box-shadow:0 0 20px #00d5ff14}.panel h2{font-size:15px;color:#66e9ff;border-bottom:1px solid #1f6073;padding-bottom:10px}button,select{width:100%;padding:11px;margin:7px 0;color:#dffaff;background:#0b2838;border:1px solid #278ba6;border-radius:6px;cursor:pointer}button:hover,select:hover,button.active{background:#12465b;box-shadow:0 0 12px #00bce6}.stat{margin:15px 0}.stat-title{display:flex;justify-content:space-between;font-size:12px;color:#a3cbd7}.bar{height:8px;margin-top:5px;background:#07141c;border-radius:10px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#008eb3,#7cf6ff);box-shadow:0 0 10px #00d9ff}.stage{min-height:610px;position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden;border:1px solid #21738a;border-radius:12px;background:linear-gradient(#00b5e20d 1px,transparent 1px),linear-gradient(90deg,#00b5e20d 1px,transparent 1px),#06131d;background-size:35px 35px}.scan-line{position:absolute;width:100%;height:2px;background:#66efff;box-shadow:0 0 20px #00eaff;animation:scan 4s linear infinite;opacity:.5}@keyframes scan{from{top:0}to{top:100%}}.armor{width:230px;height:480px;position:relative;transition:transform .6s;filter:drop-shadow(0 0 22px #00dcff59)}.armor.turn{transform:rotateY(180deg)}.head{position:absolute;top:0;left:70px;width:90px;height:110px;border-radius:45% 45% 35% 35%;background:linear-gradient(110deg,#b9c4ca,#641e26 45%,#d9e1e2 70%);border:4px solid #e7f2f2;cursor:pointer}.eye{position:absolute;top:48px;width:27px;height:8px;background:#9cfaff;box-shadow:0 0 14px #00eaff}.eye.left{left:13px;transform:rotate(12deg)}.eye.right{right:13px;transform:rotate(-12deg)}.face{position:absolute;left:28px;top:67px;width:34px;height:25px;border:3px solid #b9c4ca;border-top:0}.torso{position:absolute;top:100px;left:35px;width:160px;height:220px;border-radius:42% 42% 20% 20%;background:linear-gradient(90deg,#671c25,#c9d2d3 25%,#7d2029 50%,#ced7d7 75%,#611b23);border:5px solid #dfe9e8;cursor:pointer}.arc{position:absolute;top:65px;left:52px;width:55px;height:55px;border-radius:50%;background:#caffff;border:8px solid #e9ffff;box-shadow:0 0 30px #00eaff,inset 0 0 15px #00aeca}.arm{position:absolute;top:115px;width:45px;height:190px;border-radius:25px;background:linear-gradient(90deg,#651d26,#bdc9cb,#711f27);border:4px solid #dbe8e8;cursor:pointer}.arm.left{left:-5px;transform:rotate(8deg)}.arm.right{right:-5px;transform:rotate(-8deg)}.hand{position:absolute;bottom:0;width:52px;height:65px;border-radius:20px;background:#c7d2d4;border:4px solid #e5eeee}.hand.left{left:-10px}.hand.right{right:-10px}.leg{position:absolute;top:300px;width:65px;height:180px;border-radius:15px 15px 30px 30px;background:linear-gradient(90deg,#6e2028,#c8d2d2,#682029);border:4px solid #d9e6e5;cursor:pointer}.leg.left{left:45px;transform:rotate(3deg)}.leg.right{right:45px;transform:rotate(-3deg)}.interior .head,.interior .torso,.interior .arm,.interior .hand,.interior .leg{background:linear-gradient(135deg,#172c38,#193f4d);border-color:#35eaff;box-shadow:inset 0 0 20px #008ba7,0 0 12px #00d9ff}.interior .arc{background:#ffdf72;box-shadow:0 0 30px #ffae00}.hotspot{position:absolute;padding:5px 8px;font-size:11px;background:#07131c;color:#82f4ff;border:1px solid #2dd8ef;border-radius:5px;opacity:0;pointer-events:none;transition:.3s}.show-hotspots .hotspot{opacity:1}.h1{top:150px;left:-110px}.h2{top:70px;right:-120px}.h3{top:260px;right:-125px}.h4{bottom:50px;left:-110px}.info-box{min-height:150px;color:#acd3dc;font-size:14px;line-height:1.5}.warning{color:#ffcf68;font-size:12px;margin-top:25px}@media(max-width:900px){.game{grid-template-columns:1fr}.stage{min-height:570px}}
</style></head>
<body><header><h1>STARK ARMOR LAB</h1><div class="subtitle">Laboratorio de inspección de armaduras</div></header><main class="game">
<aside class="panel"><h2>MODELOS</h2><select id="model"><option>Mark III</option><option>Mark XLII</option><option>Mark L</option><option>Mark LXXXV</option></select><h2>VISTA</h2><button id="outside" class="active">Exterior</button><button id="inside">Interior</button><button id="rotate">Girar armadura</button><button id="hotspots">Mostrar partes</button><p class="warning">Prototipo fan-made. No utiliza imágenes oficiales.</p></aside>
<section class="stage"><div class="scan-line"></div><div id="armor" class="armor"><div class="head" data-part="Casco"><div class="eye left"></div><div class="eye right"></div><div class="face"></div></div><div class="torso" data-part="Núcleo ARC"><div class="arc"></div></div><div class="arm left" data-part="Guantelete izquierdo"><div class="hand left"></div></div><div class="arm right" data-part="Guantelete derecho"><div class="hand right"></div></div><div class="leg left" data-part="Propulsor de pierna"></div><div class="leg right" data-part="Propulsor de pierna"></div><div class="hotspot h1">Servomotores</div><div class="hotspot h2">HUD del casco</div><div class="hotspot h3">Repulsor</div><div class="hotspot h4">Batería auxiliar</div></div></section>
<aside class="panel"><h2 id="modelTitle">MARK III</h2><div class="stat"><div class="stat-title"><span>Resistencia</span><span>86%</span></div><div class="bar"><div style="width:86%"></div></div></div><div class="stat"><div class="stat-title"><span>Potencia</span><span>72%</span></div><div class="bar"><div style="width:72%"></div></div></div><div class="stat"><div class="stat-title"><span>Movilidad</span><span>80%</span></div><div class="bar"><div style="width:80%"></div></div></div><h2>ANÁLISIS</h2><div id="info" class="info-box">Seleccioná una parte de la armadura para analizarla.</div></aside></main>
<script>
const $=s=>document.querySelector(s),armor=$('#armor'),info=$('#info'),outside=$('#outside'),inside=$('#inside'),model=$('#model'),title=$('#modelTitle');let interior=false;
const descriptions={'Casco':'Sistema de visión frontal con HUD, análisis de objetivos y comunicación integrada.','Núcleo ARC':'Fuente de energía principal. Alimenta los sistemas de vuelo, los repulsores y la computadora.','Guantelete izquierdo':'Incluye un repulsor de palma y actuadores para aumentar la fuerza.','Guantelete derecho':'Módulo de combate con repulsor, sensores y control de puntería.','Propulsor de pierna':'Controla la estabilidad durante el vuelo y permite cambios rápidos de dirección.'};
document.querySelectorAll('[data-part]').forEach(p=>p.addEventListener('click',()=>{const n=p.dataset.part;info.innerHTML='<strong>'+n+'</strong><br><br>'+descriptions[n]}));
outside.addEventListener('click',()=>{interior=false;armor.classList.remove('interior');outside.classList.add('active');inside.classList.remove('active');info.textContent='Vista exterior activada. Hacé clic en una pieza para examinarla.'});inside.addEventListener('click',()=>{interior=true;armor.classList.add('interior');inside.classList.add('active');outside.classList.remove('active');info.textContent='Vista interior activada. Se muestran los circuitos y sistemas internos.'});$('#rotate').addEventListener('click',()=>armor.classList.toggle('turn'));$('#hotspots').addEventListener('click',e=>{armor.classList.toggle('show-hotspots');e.currentTarget.classList.toggle('active')});
model.addEventListener('change',()=>{const selected=model.value,titleText=selected.toUpperCase();title.textContent=titleText;const values={'Mark III':[86,72,80],'Mark XLII':[78,88,94],'Mark L':[91,96,98],'Mark LXXXV':[97,99,90]}[selected];document.querySelectorAll('.bar div').forEach((b,i)=>b.style.width=values[i]+'%');info.innerHTML='<strong>'+selected+'</strong><br><br>Modelo cargado correctamente. Explorá el casco, el núcleo y los propulsores.'});
</script></body></html>
